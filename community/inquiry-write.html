<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>글쓰기</title>
  <link rel="stylesheet" href="/assets/css/reset.css">
  <link rel="stylesheet" href="/assets/css/common.css">
  <link rel="stylesheet" href="/components/header.css">
  <style>
    .back-to-list a {
      display: flex;
      align-items: center;
      color: rgb(var(--theme-color));
      font-weight: 500;
      text-decoration: none;
    }

    .back-to-list a:hover {
      text-decoration: underline;
    }

    .back-to-list img {
      pointer-events: none;
      width: 16px;
      height: 16px;
      transform: rotate(90deg);
      filter: brightness(0) saturate(100%) invert(43%) sepia(82%) saturate(3067%) hue-rotate(180deg) brightness(100%) contrast(101%);
    }

    .back-to-list .qna-text {
      font-family: 'Elms Sans', sans-serif;
      letter-spacing: -0.05em;
      word-spacing: -0.2em;
      padding-right: 0.05em;
      font-weight: 600;
    }

    #box {
      margin: 60px auto 0;
      padding: 0 40px;
      max-width: 1000px;
      box-sizing: border-box;
    }

    h1 {
      font-size: 32px;
      line-height: 1.4;
      font-weight: 500;
      margin-top: 30px;
      margin-bottom: 10px;

      user-select: none;
    }

    .write-box {
      display: flex;
      flex-direction: column;
      gap: 16px;
      margin-bottom: 30px;
    }

    #title,
    #content {
      width: 100%;
      font-size: 16px;
      padding: 14px;
      box-sizing: border-box;
    }

    #title {
      height: 50px;
      border: 1px solid rgba(var(--border-color), 0.5);
      border-radius: 6px;
    }

    #content {
      width: 100%;
      min-height: 300px;

      padding: 14px;
      box-sizing: border-box;

      font-size: 16px;

      resize: none;
      overflow-y: auto;
    }

    #title:focus,
    #content:focus {
      outline: none;
    }

    .btn-box {
      display: flex;
      justify-content: flex-end;
      margin-bottom: 30px;
    }

    .btn-box button {
      width: 60px;
      height: 30px;
      box-sizing: border-box;
      font-weight: 600;

      border-radius: 15px;
    }

    #post-btn {
      width: 60px;
      height: 30px;
    }

    hr {
      margin: 18px 0 8px;
      width: 100%;
      height: 3px;
      outline: 0 none;
      border: 0 none;
      background-color: rgb(var(--border-color));
      margin-bottom: 20px;
    }

    input::placeholder,
    textarea::placeholder {
      font-size: 16px;
    }
  </style>
</head>

<body>
  <div id="header-container"></div>
  <main>
    <div id="box">
      <div class="back-to-list">
        <a href="/community/inquiry-list.html"><img src="/assets/images/common/angle-down-solid.svg" alt=""><span
            class="qna-text">Q&A</span>&nbsp;목록으로 돌아가기</a>
      </div>
      <h1>글쓰기</h1>
      <hr />
      <div class="write-inner">
        <div class="write-box">
          <input id="title" type="text" placeholder="제목을 입력하세요">
          <textarea id="content" placeholder="내용을 입력하세요"></textarea>
        </div>
        <div class="btn-box">
          <button class="with-theme-color" id="post-btn">등록</button>
        </div>
      </div>
    </div>
  </main>
  <div id="footer-container"></div>
  <script type="module">

    import { mountHeader } from "/components/header.js";

    const currentUserId = localStorage.getItem("currentUser");

    if (!currentUserId || currentUserId === "false") {
      alert('로그인이 필요한 서비스입니다.');
      window.location.href = 'auth/login.html';
    }

    function getQueryParam(key) {
      const params = new URLSearchParams(window.location.search);
      return params.get(key);
    }

    function initEditMode() {
      const postId = getQueryParam('id');

      if (!postId) return;

      const postList = JSON.parse(localStorage.getItem('posts')) || [];
      const post = postList.find(p => p.id === postId);

      if (!post) {
        alert('존재하지 않는 게시글입니다.');
        location.href = 'inquiry-list.html';
        return;
      }

      document.querySelector('h1').innerText = '글 수정하기';
      document.getElementById('post-btn').innerText = '수정';
      document.getElementById('post-btn').classList.remove('with-theme-color');

      document.getElementById('title').value = post.title;
      document.getElementById('content').value = post.content;
    }

    function formatDate(date) {
      const year = date.getFullYear();
      const month = String(date.getMonth() + 1).padStart(2, '0');
      const day = String(date.getDate()).padStart(2, '0');
      const hours = String(date.getHours()).padStart(2, '0');
      const minutes = String(date.getMinutes()).padStart(2, '0');
      const seconds = String(date.getSeconds()).padStart(2, '0');

      return `${year}-${month}-${day} ${hours}:${minutes}:${seconds}`;
    }

    function handlePostSubmit() {
      const storedUsers = localStorage.getItem("users");
      const userMap = storedUsers ? JSON.parse(storedUsers) : {};

      const titleInput = document.getElementById('title').value;
      const contentInput = document.getElementById('content').value;

      if (!titleInput.trim() || !contentInput.trim()) {
        alert('제목과 내용을 모두 입력해주세요.');
        return;
      }

      const postList = JSON.parse(localStorage.getItem('posts')) || [];
      const postId = getQueryParam('id');

      if (postId) {
        const postIndex = postList.findIndex(p => p.id === postId);

        if (postIndex === -1) {
          alert('게시글을 찾을 수 없습니다.');
          return;
        }

        postList[postIndex].title = titleInput;
        postList[postIndex].content = contentInput;
        postList[postIndex].renewalDate = formatDate(new Date());

        localStorage.setItem('posts', JSON.stringify(postList));
        alert('게시글이 수정되었습니다.');
        window.location.href = `inquiry-view.html?id=${postId}`;

      } else {
        const loggedInUser = userMap[currentUserId];
        const userNickname = loggedInUser ? loggedInUser.nickname : "익명";

        const newPost = {
          id: crypto.randomUUID(),
          title: titleInput,
          author: userNickname,
          authorId: currentUserId,
          content: contentInput,
          date: formatDate(new Date()),
          renewalDate: "",
          answered: false,
          reply: "",
          replyDate: ""
        };

        postList.push(newPost);
        localStorage.setItem('posts', JSON.stringify(postList));
        window.location.href = "inquiry-list.html";
      }
    }

    document.getElementById('post-btn').addEventListener('click', handlePostSubmit);
    initEditMode();

    const headerContainer = document.getElementById('header-container');
    try {
      await mountHeader(headerContainer);
    } catch (error) {
      console.error("헤더 로딩 실패:", error);
    }
  </script>
</body>

</html>
