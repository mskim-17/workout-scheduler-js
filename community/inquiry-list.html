    let currentPage = 1;
    const COUNT_PER_PAGE = 8;

    let currentSearchOption = '제목/내용';
    let currentSearchKeyword = '';

    // 1. 로컬 스토리지에서 게시글 목록 가져오기 (없으면 빈 배열)
    function getPosts() {
      const posts = localStorage.getItem('posts');
      return posts ? JSON.parse(posts) : [];
    }

    // 2. 게시글 목록을 화면에 그리는 함수
    function renderBoard() {
      const postList = getPosts();
      const boardBody = document.getElementById('board-body');

      boardBody.innerHTML = '';

      // [검색 필터링] 검색어가 존재하는 경우 조건에 따라 필터링
      let filteredPosts = [...postList];
      if (currentSearchKeyword.trim() !== '') {
        filteredPosts = postList.filter(post => {
          const keyword = currentSearchKeyword.toLowerCase();
          const title = (post.title || '').toLowerCase();
          const content = (post.content || '').toLowerCase();
          const author = (post.author || '').toLowerCase();

          if (currentSearchOption === '제목/내용') {
            return title.includes(keyword) || content.includes(keyword);
          } else if (currentSearchOption === '제목') {
            return title.includes(keyword);
          } else if (currentSearchOption === '작성자') {
            return author.includes(keyword);
          }
          return true;
        });
      }

      // 검색 결과가 없을 때
      if (filteredPosts.length === 0) {
        boardBody.innerHTML = `<tr><td colspan="4" style="text-align:center; padding:30px;">게시글이 없습니다.</td></tr>`;
        renderPagination(0);
        return;
      }

      // 필터링된 데이터를 기준으로 최신글 순 정렬
      const reversedPosts = filteredPosts.reverse();

      const startIndex = (currentPage - 1) * COUNT_PER_PAGE;
      const endIndex = startIndex + COUNT_PER_PAGE;
      const pagePosts = reversedPosts.slice(startIndex, endIndex);

      pagePosts.forEach(post => {
        const statusText = post.answered ? '답변완료' : '처리중';
        const row = document.createElement('tr');
        let displayDate = post.date;
        if (displayDate && displayDate.includes('-')) {
          const parts = displayDate.split(' ')[0].split('-');
          displayDate = `${parts[0]}. ${parseInt(parts[1])}. ${parseInt(parts[2])}.`;
        }
        row.innerHTML = `
                    <td><span class="${post.answered ? "answered" : "not-answered"}">${statusText}</span></td>
                    <td class="title"><a href="inquiry-view.html?id=${post.id}">${post.title}</a></td>
                    <td class="author"><span>${post.author}</span></td>
                    <td class="date"><span>${displayDate}</span></td>
                `;
        boardBody.appendChild(row);
      });

      renderPagination(reversedPosts.length);
    }

    // 하단 페이지 번호 버튼을 동적으로 그려주는 함수
    function renderPagination(totalCount) {
      const paginationContainer = document.getElementById('pagination-container');
      paginationContainer.innerHTML = '';

      if (totalCount === 0) return;

      // 총 페이지 수 계산 (예: 11개 글 -> 2페이지)
      const totalPages = Math.ceil(totalCount / COUNT_PER_PAGE);

      // 이전 페이지 이동 버튼 (<)
      const prevBtn = document.createElement('button');
      prevBtn.type = 'button';
      prevBtn.classList.add('prev-page-btn');
      prevBtn.innerHTML = `<img src="/assets/images/common/angle-down-solid.svg" alt="">`;
      prevBtn.disabled = currentPage === 1; // 1페이지면 비활성화
      prevBtn.addEventListener('click', () => {
        if (currentPage > 1) {
          currentPage--;
          renderBoard();
        }
      });
      paginationContainer.appendChild(prevBtn);

      // 숫자 페이지 버튼들 동적 생성
      for (let i = 1; i <= totalPages; i++) {
        const pageBtn = document.createElement('button');
        pageBtn.type = 'button';
        pageBtn.textContent = i;

        // 현재 보고 있는 페이지 버튼에 스타일 변화 부여용 (선택 사항)
        pageBtn.classList.toggle('active', i === currentPage);

        pageBtn.addEventListener('click', () => {
          currentPage = i;
          renderBoard();
        });
        paginationContainer.appendChild(pageBtn);
      }

      // 다음 페이지 이동 버튼 (>)
      const nextBtn = document.createElement('button');
      nextBtn.type = 'button';
      nextBtn.classList.add('next-page-btn');
      nextBtn.innerHTML = `<img src="/assets/images/common/angle-down-solid.svg" alt="">`;
      nextBtn.disabled = currentPage === totalPages; // 마지막 페이지면 비활성화
      nextBtn.addEventListener('click', () => {
        if (currentPage < totalPages) {
          currentPage++;
          renderBoard();
        }
      });
      paginationContainer.appendChild(nextBtn);
    }

    // 검색 요소 가져오기
    const searchSelect = document.querySelector('.search-box select');
    const searchInput = document.querySelector('.search-box input');
    const searchBtn = document.querySelector('.search-box button');

    // 검색 실행 함수
    function handleSearch() {
      currentSearchOption = searchSelect.value;
      currentSearchKeyword = searchInput.value;
      currentPage = 1; // 검색 시 항상 1페이지로 리셋
      renderBoard();
    }

    // 이벤트 바인딩
    searchBtn.addEventListener('click', handleSearch);
    searchInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') {
        handleSearch();
      }
    });

    // 글쓰기 버튼 요소 가져오기
    const writeBtn = document.querySelector('.btn-write');

    // 글쓰기 버튼 클릭 이벤트 핸들러
    writeBtn.addEventListener('click', () => {
      // 로컬 스토리지에서 currentUser 데이터 확인
      const currentUser = localStorage.getItem('currentUser');

      if (currentUser) {
        // currentUser가 존재할 때만 글쓰기 페이지로 이동
        location.href = 'inquiry-write.html';
      } else {
        // 존재하지 않을 때 경고창 띄우기
        alert('로그인이 필요한 서비스입니다.');
      }
    });

    renderBoard();
  </script>
</body>

</html>
