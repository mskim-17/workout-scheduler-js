<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <link rel="stylesheet" href="/assets/css/reset.css">
  <link rel="stylesheet" href="/assets/css/common.css">
  <link rel="stylesheet" href="/assets/css/pages/auth/login.css">
  <link rel="stylesheet" href="/components/header.css">
</head>

<body>
  <div id="header-container"></div>
  <main>
    <div class="login-box">
      <h1>로그인</h1>

      <div class="input-group">
        <label for="user-id">아이디</label>
        <input id="user-id" type="text">
      </div>

      <div class="input-group" data-role="password-wrapper">
        <label for="user-pw">비밀번호</label>
        <input id="user-pw" type="password">
      </div>
      <span id="login-error" class="error-msg"></span>
      <button id="login" type="button" class="with-theme-color">로그인</button>
      <div class="auth-link">
        이 서비스가 처음이신가요?
        <a href="signup.html">회원가입하기</a>
      </div>
    </div>
  </main>
  <div id="footer-container"></div>
  <script src="/assets/js/common/common.js" defer></script>
  <script type="module">
    import { mountHeader } from "/components/header.js";
    import { initLogin } from "/assets/js/pages/auth/login.js";

    const headerContainer = document.getElementById('header-container');
    
    await mountHeader(headerContainer);

    initLogin(); 

  </script>
</body>

</html>
