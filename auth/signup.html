<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <link rel="stylesheet" href="/assets/css/reset.css">
  <link rel="stylesheet" href="/assets/css/common.css">
  <link rel="stylesheet" href="/assets/css/pages/auth/signup.css">
  <link rel="stylesheet" href="/components/header.css">
</head>

<body>
  <div id="header-container"></div>

  <main>
    <div class="auth-box">
      <h1>회원가입</h1>

      <div class="input-group">
        <label for="user-id">아이디</label>
        <input id="user-id" type="text">
      </div>

      <div class="input-group" data-role="password-wrapper">
        <label for="user-pw">비밀번호</label>
        <input id="user-pw" type="password">
      </div>

      <div class="input-group" data-role="password-wrapper">
        <label for="pw-check">비밀번호 확인</label>
        <input id="pw-check" type="password">
      </div>
      <span id="auth-error" class="error-msg"></span>
      <button id="regist" type="button" class="with-theme-color">
        회원가입하기
      </button>

      <div class="auth-link">
        이미 회원이신가요?
        <a href="login.html">로그인하기</a>
      </div>
    </div>
  </main>

  <div id="footer-container"></div>
  <script src="/assets/js/common/common.js" defer></script>
  <script type="module">
    import { mountHeader } from "/components/header.js";
    import { initRegister } from "/assets/js/pages/auth/signup.js";

    const headerContainer = document.getElementById('header-container');
    
    await mountHeader(headerContainer);

    initRegister();

  </script>
</body>

</html>
