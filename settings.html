<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <link rel="stylesheet" href="/assets/css/reset.css">
  <link rel="stylesheet" href="/assets/css/common.css">
  <link rel="stylesheet" href="/components/header.css">
  <style>
    .settings-inner {
      margin: 60px auto 0;
      max-width: 1000px;
      box-sizing: border-box;
    }

    h1 {
      margin: 0 20px;
      font-size: 32px;
      font-weight: 500;
      text-align: left;

      user-select: none;
      padding-bottom: 20px;
    }

    hr {
      height: 1px;
      outline: 0 none;
      border: 0 none;
      background-color: rgb(var(--border-color));
      margin-bottom: 80px;
    }

    #main-container {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 140px;
      position: relative;
      padding-bottom: 120px;
    }

    #left-box,
    #right-box {
      flex: 0 0 400px;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .form-group {
      display: flex;
      align-items: center;
      justify-content: center;
      margin-right: 48px;
      gap: 15px;
    }

    .form-group label {
      display: inline-block;
      font-size: 16px;
      font-weight: 500;
      opacity: 80%;
      min-width: 110px;
      text-align: right;
      white-space: nowrap;
    }

    .input-wrapper {
      display: flex;
      align-items: center;
      gap: 8px;
      position: relative;
    }

    .form-group input,
    .form-group select,
    .form-group .dropdown-container {
      width: 250px;
      height: 44px;
      box-sizing: border-box;
      border: none;
      border-radius: 22px;
      font-size: 15px;
      outline: none;

      transition: 0.35s ease;
    }

    .form-group input:not(:disabled):hover,
    .form-group select:hover,
    .dropdown-button:not(:disabled):hover {
      filter: brightness(102%);
      box-shadow: 0 0px 4px 2px rgba(var(--theme-color), 0.2);
    }

    .form-group input,
    .form-group select {
      padding: 0 20px;
      border: 1px solid rgba(var(--border-color), 0.4);
      background-color: rgb(var(--bg-color2));
    }

    .form-group select {
      -webkit-appearance: none;
      -moz-appearance: none;
      appearance: none;
      background-image: url("/assets/images/common/angle-down-solid.svg");
      background-repeat: no-repeat;
      background-position: calc(100% - 20px) center;
      background-size: 12px;
      cursor: pointer;
    }

    /* 온보드 기반 생년월일 커스텀 드롭다운 컨테이너 스타일 */
    .dropdown-container {
      display: flex;
      gap: 6px;
      align-items: center;
      background: transparent;
    }

    .dropdown {
      position: relative;
      height: 100%;

      display: flex;
      align-items: center;
    }

    .dropdown-wrapper {
      position: relative;
      height: 100%;

      display: flex;
      align-items: center;
    }

    .dropdown-button {
      width: 55px;
      height: 100%;
      border: 1px solid rgba(var(--border-color), 0.4);
      background-color: rgb(var(--bg-color2));
      border-radius: 22px;
      padding: 0 14px 0 0;
      font-size: 14px;
      text-align: left;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: space-evenly;
      box-sizing: border-box;

      margin-bottom: 0;
      transition: 0.35s ease;
    }

    .dropdown#birth-year .dropdown-button {
      width: 70px;
    }

    .dropdown-button>span {
      text-align: center;
    }

    .dropdown>span {
      display: block;
      margin: 0 8px;
    }

    .dropdown-button:disabled {
      opacity: 30%;
      cursor: default;
    }

    .dropdown-wrapper img {
      width: 14px;
      height: 14px;
      position: absolute;
      right: 10px;
      opacity: 80%;

      pointer-events: none;
    }

    .dropdown-button:disabled~img {
      opacity: 17%;
    }

    /* .dropdown-button::after {
      content: "";
      width: 0;
      height: 0;
      border-left: 4px solid transparent;
      border-right: 4px solid transparent;
      border-top: 5px solid #333;
    }

    .dropdown-button:disabled::after {
      border-top-color: #bbb;
    } */

    .dropdown-list {
      position: absolute;
      top: 48px;
      left: 0;
      width: 100%;
      max-height: 0;
      background-color: white;
      border-radius: 12px;
      overflow-y: hidden;
      z-index: 100;
      box-sizing: border-box;
      transition: max-height 0.2s ease-in-out;
    }

    .dropdown.open .dropdown-list {
      max-height: 160px;
      overflow-y: scroll;
    }

    .dropdown-list div {
      padding: 8px 12px;
      font-size: 14px;
      cursor: pointer;
    }

    .dropdown-list div:hover {
      background-color: #f0f0f0;
    }

    .dropdown-label {
      font-size: 16px;
      color: #333;
      white-space: nowrap;
    }

    .unit,
    .birth-date-unit {
      font-size: 16px;
      color: #333;
      position: absolute;
      left: 258px;
      white-space: nowrap;
    }

    .form-group input:disabled {
      opacity: 60%;
      color: rgb(var(--smalltext-color));
    }

    #right-box a {
      align-self: flex-end;
      text-decoration: none;
      font-size: 14px;
      color: #888;
      margin-right: 0;
    }

    #right-box {
      justify-content: flex-start;
    }

    .small-link {
      width: 100%;
      text-align: right;
    }

    .small-link a#delete-account {
      display: block;
      margin-right: 50px;
      color: crimson;
      margin-top: 5px;

      transition: 0.15s ease;
    }

    .small-link a#delete-account:hover {
      font-weight: 600;
      filter: brightness(90%);
    }

    #main-container>button {
      position: absolute;
      bottom: 0;
      right: 40px;
      width: 150px;
      height: 40px;
      border-radius: 20px;
      color: white;
      border: none;
      box-sizing: border-box;
      font-size: 16px;
      font-weight: bold;
    }
  </style>
</head>

<body>
  <div id="header-container"></div>
  <main>
    <div class="settings-inner">
      <h1>회원정보 수정</h1>
      <hr>
      <div id="main-container">
        <div id="left-box">
          <div class="form-group">
            <label>닉네임</label>
            <div class="input-wrapper">
              <input type="text" id="nickname">
            </div>
          </div>
          <div class="form-group">
            <label>성별</label>
            <div class="input-wrapper">
              <select name="" id="gender">
                <option value="male">남성</option>
                <option value="female">여성</option>
                <option value="other">기타</option>
              </select>
            </div>
          </div>
          <div class="form-group">
            <label>생년월일</label>
            <div class="input-wrapper">
              <div class="dropdown-container">
                <div class="dropdown" id="birth-year">
                  <div class="dropdown-wrapper">
                    <button class="dropdown-button ignore-default"><span></span></button>
                    <div class="dropdown-list"></div>
                    <img src="/assets/images/common/angle-down-solid.svg" alt="">
                  </div>
                  <span class="dropdown-label">년</span>
                </div>
                <div class="dropdown" id="birth-month">
                  <div class="dropdown-wrapper">
                    <button class="dropdown-button ignore-default"><span></span></button>
                    <div class="dropdown-list"></div>
                    <img src="/assets/images/common/angle-down-solid.svg" alt="">
                  </div>
                  <span class="dropdown-label">월</span>
                </div>
                <div class="dropdown" id="birth-date">
                  <div class="dropdown-wrapper">
                    <button class="dropdown-button ignore-default"><span></span></button>
                    <div class="dropdown-list"></div>
                    <img src="/assets/images/common/angle-down-solid.svg" alt="">
                  </div>
                </div>
                <span class="birth-date-unit">일</span>
              </div>
            </div>
          </div>
          <div class="form-group">
            <label>신장</label>
            <div class="input-wrapper">
              <input type="text" id="height">
              <span class="unit">cm</span>
            </div>
          </div>
          <div class="form-group">
            <label>체중</label>
            <div class="input-wrapper">
              <input type="text" id="weight">
              <span class="unit">kg</span>
            </div>
          </div>
        </div>

        <div id="right-box">
          <div class="form-group">
            <label>아이디</label>
            <div class="input-wrapper">
              <input type="text" placeholder="" disabled id="username">
            </div>
          </div>
          <div class="form-group">
            <label>새 비밀번호</label>
            <div class="input-wrapper">
              <input type="password" id="password">
            </div>
          </div>
          <div class="form-group">
            <label>새 비밀번호 확인</label>
            <div class="input-wrapper">
              <input type="password" id="passwordCheck">
            </div>
          </div>
          <div class="small-link">
            <a href="#" id="delete-account">탈퇴하기</a>
          </div>
          <!-- <a href="../onboard/onboard.html">운동 강도 다시 추천 받기</a> -->
        </div>
        <button class="with-theme-color" id="save-btn">저장하기</button>
      </div>
    </div>
  </main>
  <div id="footer-container"></div>
  <script type="module">
    const currentUser = localStorage.getItem('currentUser');

    if (!currentUser || currentUser === "false") {
      alert('로그인이 필요한 서비스입니다.');
      window.location.href = 'auth/login.html';
    }

    import { mountHeader } from "/components/header.js";
    const headerContainer = document.getElementById('header-container');
    await mountHeader(headerContainer);

    const idInput = document.getElementById('username');
    idInput.placeholder = currentUser;

    const storedUsers = localStorage.getItem("users");
    const userMap = storedUsers ? JSON.parse(storedUsers) : {};
    const targetUser = userMap[currentUser];

    const nicknameInput = document.getElementById('nickname');
    const genderSelect = document.getElementById('gender');
    const heightInput = document.getElementById('height');
    const weightInput = document.getElementById('weight');

    const birthYearDropdown = document.getElementById('birth-year');
    const birthMonthDropdown = document.getElementById('birth-month');
    const birthDateDropdown = document.getElementById('birth-date');
    const birthYearButton = birthYearDropdown.querySelector('.dropdown-button');
    const birthMonthButton = birthMonthDropdown.querySelector('.dropdown-button');
    const birthDateButton = birthDateDropdown.querySelector('.dropdown-button');
    const birthYearList = birthYearDropdown.querySelector('.dropdown-list');
    const birthMonthList = birthMonthDropdown.querySelector('.dropdown-list');
    const birthDateList = birthDateDropdown.querySelector('.dropdown-list');

    const thisYear = new Date().getFullYear();
    const thisMonth = new Date().getMonth() + 1;
    const thisDate = new Date().getDate();

    for (let year = thisYear; year >= 1900; year--) {
      const div = document.createElement('div');
      div.dataset.value = year;
      div.innerText = year;
      birthYearList.appendChild(div);
    }

    const setMonthRange = year => {
      birthMonthList.innerHTML = '';
      for (let month = 1; month <= (year == thisYear ? thisMonth : 12); month++) {
        const div = document.createElement('div');
        div.dataset.value = month;
        div.innerText = month;
        birthMonthList.appendChild(div);
      }
    }

    const isDateValid = (year, month, date) => {
      let rawDate = new Date(year, month - 1, date);
      return !(rawDate.getFullYear() != year || rawDate.getMonth() != month - 1 || rawDate.getDate() != date);
    }

    const setDateRange = (year, month) => {
      birthDateList.innerHTML = '';
      for (let date = 1; date <= ((year == thisYear && month == thisMonth) ? thisDate : 31); date++) {
        if (!isDateValid(year, month, date)) return;
        const div = document.createElement('div');
        div.dataset.value = date;
        div.innerText = date;
        birthDateList.appendChild(div);
      }
    }

    function updateBirthdaySelect() {
      let year = birthYearButton.dataset.value;
      let month = birthMonthButton.dataset.value;
      let date = birthDateButton.dataset.value;

      birthMonthButton.disabled = !(year);
      birthDateButton.disabled = !(month);

      setMonthRange(year);
      if (month) setDateRange(year, month);

      if (year == thisYear && month) {
        if (month > thisMonth) {
          month = thisMonth;
          if (date) date = thisDate;
        } else if (month == thisMonth) {
          if (date && date > thisDate) date = thisDate;
          else {
            if (date) date = isDateValid(year, month, date) ? date : 1;
          }
        } else {
          if (date) date = isDateValid(year, month, date) ? date : 1;
        }
      } else if (date) {
        date = isDateValid(year, month, date) ? date : 1;
      }

      if (month) {
        birthMonthButton.dataset.value = month;
        birthMonthButton.querySelector('span').textContent = `${month}`;
      }
      if (date) {
        birthDateButton.dataset.value = date;
        birthDateButton.querySelector('span').textContent = `${date}`;
      }
    }

    birthYearList.addEventListener('click', event => {
      let year = event.target.dataset.value;
      if (year) {
        birthYearButton.dataset.value = year;
        birthYearButton.querySelector('span').textContent = `${year}`;
        updateBirthdaySelect();
        birthYearDropdown.classList.remove('open');
      }
    });

    birthMonthList.addEventListener('click', event => {
      let month = event.target.dataset.value;
      if (month) {
        birthMonthButton.dataset.value = month;
        birthMonthButton.querySelector('span').textContent = `${month}`;
        updateBirthdaySelect();
        birthMonthDropdown.classList.remove('open');
      }
    });

    birthDateList.addEventListener('click', event => {
      let date = event.target.dataset.value;
      if (date) {
        birthDateButton.dataset.value = date;
        birthDateButton.querySelector('span').textContent = `${date}`;
        updateBirthdaySelect();
        birthDateDropdown.classList.remove('open');
      }
    });

    document.addEventListener('click', e => {
      [birthYearDropdown, birthMonthDropdown, birthDateDropdown].forEach(dropdown => {
        if (!dropdown.contains(e.target)) {
          dropdown.classList.remove('open');
        }
      });
    });

    const dropdowns = [birthYearDropdown, birthMonthDropdown, birthDateDropdown];
    dropdowns.forEach(dropdown => {
      const button = dropdown.querySelector('.dropdown-button');
      const list = dropdown.querySelector('.dropdown-list');
      list.style.overflowY = 'hidden';

      button.addEventListener('click', (e) => {
        e.stopPropagation();
        dropdowns.forEach(d => { if (d !== dropdown) d.classList.remove('open'); });
        const isOpen = dropdown.classList.toggle('open');
        if (isOpen) {
          list.style.overflowY = 'scroll';
        }
      });

      list.addEventListener('transitionend', e => {
        if (e.propertyName === 'max-height' && !dropdown.classList.contains('open')) {
          list.style.overflowY = 'hidden';
        }
      });
    });

    if (targetUser) {
      if (targetUser.nickname) nicknameInput.value = targetUser.nickname;
      if (targetUser.gender) genderSelect.value = targetUser.gender;
      if (targetUser.height) heightInput.value = targetUser.height;
      if (targetUser.weight) weightInput.value = targetUser.weight;

      if (targetUser.birthday) {
        const parts = targetUser.birthday.split('-');
        const y = parseInt(parts[0], 10);
        const m = parseInt(parts[1], 10);
        const d = parseInt(parts[2], 10);

        birthYearButton.dataset.value = y;
        birthYearButton.querySelector('span').textContent = `${y}`;

        setMonthRange(y);
        birthMonthButton.disabled = false;
        birthMonthButton.dataset.value = m;
        birthMonthButton.querySelector('span').textContent = `${m}`;

        setDateRange(y, m);
        birthDateButton.disabled = false;
        birthDateButton.dataset.value = d;
        birthDateButton.querySelector('span').textContent = `${d}`;
      } else {
        birthMonthButton.disabled = true;
        birthDateButton.disabled = true;
      }
    }

    function applyBodyInfoValidation() {
      function clampValue(e) {
        const input = e.target;
        if (input.value.trim() !== "") {
          let value = input.value;
          if (isNaN(value)) value = 0;
          if (input.id == 'height') value = value < 0 ? 0 : value > 270 ? 270 : value;
          if (input.id == 'weight') value = value < 0 ? 0 : value > 600 ? 600 : value;
          input.value = Number(value).toFixed(1);
        }
      }
      [heightInput, weightInput].forEach(input => {
        input.addEventListener('blur', clampValue);
      });
    }
    applyBodyInfoValidation();

    const saveButton = document.getElementById('save-btn');

    saveButton.addEventListener('click', () => {
      if (nicknameInput.value.trim() === '') {
        alert("이름은 비워둘 수 없습니다.");
        return;
      }

      const y = birthYearButton.dataset.value;
      const m = birthMonthButton.dataset.value;
      const d = birthDateButton.dataset.value;

      if (!y || !m || !d) {
        alert("생년월일을 완전히 선택해주세요.");
        return;
      }

      const pwd = document.getElementById('password').value;
      const pwdCheck = document.getElementById('passwordCheck').value;

      if (pwd !== "" || pwdCheck !== "") {
        const pwRegex = /^.{4,}$/;
        if (pwd.includes(" ") || !pwRegex.test(pwd)) {
          alert("사용불가능한 비밀번호입니다. (공백 없이 4자 이상)");
          return;
        }
        if (pwd !== pwdCheck) {
          alert("비밀번호가 일치하지 않습니다.");
          return;
        }
        targetUser.password = pwd;
      }

      const updatedBirthdayString = `${y}-${String(m).padStart(2, '0')}-${String(d).padStart(2, '0')}`;

      targetUser.birthday = updatedBirthdayString;
      targetUser.nickname = nicknameInput.value;
      targetUser.gender = genderSelect.value;
      targetUser.height = Number(heightInput.value) || 0;
      targetUser.weight = Number(weightInput.value) || 0;

      userMap[currentUser] = targetUser;
      localStorage.setItem("users", JSON.stringify(userMap));

      alert("회원정보가 수정되었습니다.");
    });

    document.getElementById('delete-account').addEventListener('click', (e) => {
      e.preventDefault();
      if (confirm("정말로 탈퇴하시겠습니까? 삭제된 데이터는 복구할 수 없습니다.")) {
        delete userMap[currentUser];
        localStorage.setItem("users", JSON.stringify(userMap));
        localStorage.removeItem('currentUser');
        alert("탈퇴가 완료되었습니다.");
        window.location.href = "/auth/login.html";
      }
    });
  </script>
</body>

</html>
